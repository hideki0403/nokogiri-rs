[package]
name = "nokogiri-rs"
version = "2026.5.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
serde = {version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
axum-extra = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = { version = "0.45", features = ["tracing", "anyhow", "tower-axum-matched-path"]}
urlencoding = "2.1"
regex = "1.12"
url = "2.5"
once_cell = "1.21"
config = "0.15"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
uuid = { version = "1.23", features = ["v4"] }
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["native-tls", "gzip", "brotli", "deflate", "cookies", "json"]}
scraper = { version = "0.27", features = ["atomic"] }
htmlentity = "1.3"
futures = "0.3"
reqwest-middleware = "0.5"
hickory-resolver = "0.26"
redis = { version = "1.2", features = ["tokio-comp"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
texting_robots = "0.2"
parse-size = "1.1"
language-tags = "0.3"
